name: Build Terminal_worse

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Compile TerminalSBX
      run: |
        clang -arch arm64 \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -miphoneos-version-min=15.0 \
          -framework Foundation \
          -framework UIKit \
          -framework CoreGraphics \
          -framework CoreFoundation \
          -framework Security \
          -framework Metal \
          -O2 \
          -dynamiclib \
          -o TerminalSBX.dylib \
          src/TerminalSBX.m
        
        ls -lh TerminalSBX.dylib
    
    - name: Download a-Shell from your release
      run: |
        curl -L -o a-shell.ipa "https://github.com/BkabyH74va/Term_Worse/releases/download/v1.0/Terminal_fixed.ipa"
        
        echo "=== Downloaded file info ==="
        ls -lh a-shell.ipa
        file a-shell.ipa
        
        if ! unzip -t a-shell.ipa > /dev/null 2>&1; then
          echo "ERROR: Downloaded file is not a valid IPA/ZIP"
          exit 1
        fi
        
        echo "IPA is valid"
    
    - name: Inject and Sign
      run: |
        set -x
        
        unzip a-shell.ipa -d a-shell
        
        echo "=== Fixing permissions ==="
        chmod -R 755 a-shell/ || true
        
        echo "=== Looking for app ==="
        ls -la a-shell/Payload/ || true
        
        APP_PATH=$(find a-shell/Payload -name "*.app" -type d 2>/dev/null | head -1)
        echo "Found app: $APP_PATH"
        
        if [ -z "$APP_PATH" ]; then
          echo "ERROR: No .app found"
          exit 1
        fi
        
        cp TerminalSBX.dylib "$APP_PATH/"
        
        # Change main app Bundle ID
        plutil -replace CFBundleIdentifier -string "com.jasonquiles.terminal" \
          "$APP_PATH/Info.plist"
        
        # Change App Extension Bundle IDs
        echo "=== Fixing App Extension Bundle IDs ==="
        find "$APP_PATH" -name "Info.plist" -type f 2>/dev/null | while read plist; do
          CURRENT_BID=$(plutil -extract CFBundleIdentifier raw "$plist" 2>/dev/null || echo "")
          if [[ "$CURRENT_BID" == *"com.apple.Terminal"* ]]; then
            NEW_BID="${CURRENT_BID/com.apple.Terminal/com.jasonquiles.terminal}"
            echo "Changing $CURRENT_BID to $NEW_BID"
            plutil -replace CFBundleIdentifier -string "$NEW_BID" "$plist"
          fi
        done
        
        echo "=== Signing dylib ==="
        codesign --force --sign - \
          --entitlements entitlements.plist \
          "$APP_PATH/TerminalSBX.dylib"
        
        echo "=== Signing app ==="
        codesign --force --sign - \
          --entitlements entitlements.plist \
          "$APP_PATH"
        
        echo "=== Creating IPA ==="
        cd a-shell
        zip -r Terminal_worse.ipa Payload/
        cd ..
        mv a-shell/Terminal_worse.ipa .
        
        ls -lh Terminal_worse.ipa
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: Terminal_worse-ipa
        path: Terminal_worse.ipa
