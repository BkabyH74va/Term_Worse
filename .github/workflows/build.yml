name: Build Terminal_worse

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Compile TerminalSBX
      run: |
        clang -arch arm64 \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -miphoneos-version-min=15.0 \
          -framework Foundation \
          -framework UIKit \
          -framework CoreGraphics \
          -framework CoreFoundation \
          -framework Security \
          -framework Metal \
          -O2 \
          -dynamiclib \
          -o TerminalSBX.dylib \
          src/TerminalSBX.m
        
        ls -lh TerminalSBX.dylib
    
    - name: Download a-Shell from your release
      run: |
        curl -L -o a-shell.ipa "https://github.com/BkabyH74va/Term_Worse/releases/download/v1.0/Terminal_fixed.ipa"
        
        echo "=== Downloaded file info ==="
        ls -lh a-shell.ipa
        file a-shell.ipa
        
        if ! unzip -t a-shell.ipa > /dev/null 2>&1; then
          echo "ERROR: Downloaded file is not a valid IPA/ZIP"
          exit 1
        fi
        
        echo "IPA is valid"
    
    - name: Inject and Sign
      run: |
        set -x
        
        unzip a-shell.ipa -d a-shell
        
        echo "=== Fixing permissions ==="
        chmod -R 755 a-shell/ || true
        
        echo "=== Looking for app ==="
        APP_PATH=$(find a-shell/Payload -name "*.app" -type d 2>/dev/null | head -1)
        echo "Found app: $APP_PATH"
        echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
        
        if [ -z "$APP_PATH" ]; then
          echo "ERROR: No .app found"
          exit 1
        fi
        
        cp TerminalSBX.dylib "$APP_PATH/"
        
        # Use Python to fix all Bundle IDs
        echo "=== Fixing Bundle IDs with Python ==="
        python3 << 'PYEOF'
import os
import plistlib

app_path = os.environ.get('APP_PATH', '')
if not app_path:
    print("ERROR: APP_PATH not set")
    exit(1)

print(f"Processing: {app_path}")

# Find all Info.plist files
for root, dirs, files in os.walk(app_path):
    for file in files:
        if file == "Info.plist":
            plist_path = os.path.join(root, file)
            print(f"Found: {plist_path}")
            
            try:
                with open(plist_path, 'rb') as f:
                    plist = plistlib.load(f)
                
                old_bid = plist.get('CFBundleIdentifier', '')
                print(f"  Old Bundle ID: {old_bid}")
                
                # Fix Bundle ID
                if '623SFGS4B7' in old_bid:
                    new_bid = old_bid.replace('.623SFGS4B7', '')
                    plist['CFBundleIdentifier'] = new_bid
                    print(f"  New Bundle ID: {new_bid}")
                elif 'com.apple.Terminal' in old_bid:
                    new_bid = old_bid.replace('com.apple.Terminal', 'com.jasonquiles.terminal')
                    plist['CFBundleIdentifier'] = new_bid
                    print(f"  New Bundle ID: {new_bid}")
                
                # Write back
                with open(plist_path, 'wb') as f:
                    plistlib.dump(plist, f)
                print(f"  ✓ Updated")
                
            except Exception as e:
                print(f"  ✗ Error: {e}")

print("Done fixing Bundle IDs")
PYEOF
        
        echo "=== Signing dylib ==="
        codesign --force --sign - \
          --entitlements entitlements.plist \
          "$APP_PATH/TerminalSBX.dylib"
        
        echo "=== Signing app ==="
        codesign --force --sign - \
          --entitlements entitlements.plist \
          "$APP_PATH"
        
        echo "=== Creating IPA ==="
        cd a-shell
        zip -r Terminal_worse.ipa Payload/
        cd ..
        mv a-shell/Terminal_worse.ipa .
        
        ls -lh Terminal_worse.ipa
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: Terminal_worse-ipa
        path: Terminal_worse.ipa
